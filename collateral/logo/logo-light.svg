<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <style>
      .brand-title-kineo {
        font-family: 'Italiana', 'Cormorant Garamond', Georgia, serif;
        font-size: 44px;
        font-weight: 400;
        letter-spacing: 6px;
        fill: #EDE2CD;
      }
      .brand-sub-kineo {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 7px;
        fill: #B89D7A;
      }
      .tagline-kineo {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 9px;
        font-weight: 400;
        letter-spacing: 3px;
        fill: #A3A099;
      }
    </style>
  </defs>

  <!-- Aperture & Light Minimal Monogram -->
  <g transform="translate(20, 30)">
    <circle cx="40" cy="40" r="36" stroke="#B89D7A" stroke-width="1.5" fill="none" opacity="0.5"/>
    <circle cx="40" cy="40" r="26" stroke="#EDE2CD" stroke-width="1.5" fill="none"/>
    <circle cx="40" cy="40" r="10" fill="#B89D7A"/>
    <path d="M28 22 L52 22" stroke="#B89D7A" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="120" y="58" class="brand-title-kineo">LENS &amp; LIGHT</text>
  <text x="122" y="78" class="brand-sub-kineo">PHOTOGRAPHY • BHOPAL</text>
  <line x1="122" y1="92" x2="480" y2="92" stroke="rgba(216, 195, 159, 0.25)" stroke-width="1"/>
  <text x="122" y="108" class="tagline-kineo">TIMELESS VISUAL LEGACIES, CAPTURED IN BHOPAL</text>
</svg>
