        font-weight: 400;
        letter-spacing: 6px;
        fill: #121110;
      }
      .brand-sub-dark {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 7px;
        fill: #8C6F4B;
      }
      .tagline-dark {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
